packages:
  - "apps/*"
  - "packages/*"

trustLockfile: true

overrides:
  rollup: ">=4.22.4"
  lodash: ">=4.17.21"
  "@mikro-orm/core": ">=6.4.0"
  "@mikro-orm/knex": ">=6.6.14"
  "@opentelemetry/sdk-node": ">=0.217.0"
  "@opentelemetry/exporter-prometheus": ">=0.217.0"
  "fast-xml-builder": ">=1.1.7"
  axios: ">=1.20.0"
  brace-expansion@<2: "1.1.21"
  brace-expansion@>=3: "5.0.12"
  "@opentelemetry/propagator-jaeger": ">=2.9.0"
  immutable: ">=5.1.8"
  postcss: ">=8.5.18"
  fast-uri: ">=4.2.1"
  sharp: ">=0.35.5"
  "@grpc/grpc-js": ">=1.14.5"
  "form-data": ">=4.0.6"
  protobufjs: ">=7.6.1 <8"
  vite: ">=6.4.4 <7"
  multer: ">=2.5.0 <3"
  source-map-js: ">=1.2.2"
  proxy-addr: ">=2.0.8"
  compression: ">=1.8.2"
  follow-redirects: ">=1.16.1"
  body-parser@<2: ">=1.20.9 <2"
  zod@>=4: ">=4.6.6 <5"
  "@graphql-tools/utils": ">=12.0.2 <13"
  "@react-email/ui>next": ">=16.4.1 <17"
  "storybook@8": ">=8.6.19 <9"
  "@storybook/core@8": ">=8.6.19 <9"
  js-yaml@3: ">=3.15.2 <4"
  js-yaml@4: ">=4.3.2 <5"
  brace-expansion@2: ">=2.1.6 <3"
  ws@8: ">=8.21.0 <9"
  image-size: ">=2.0.3"
  joi@17: ">=17.13.7 <18"
  nanoid: ">=3.3.18"
  figlet: ">=1.12.0"
  browserslist: ">=4.29.3"
  # Jest 30.4.2 broke jest-mock/jest-runtime API compatibility; pin the whole
  # jest family at 30.4.1 until a cohesive patch is published.
  jest: "30.4.1"
  jest-runtime: "30.4.1"
  jest-mock: "30.4.1"
  jest-environment-node: "30.4.1"
  jest-environment-jsdom: "30.4.1"
  "@jest/core": "30.4.1"
  # eslint 10.7.0 broke typescript-eslint@8.x (scopeManager.addGlobals API);
  # pin at 10.6.0 until typescript-eslint ships compatibility.
  eslint: "10.6.0"

auditConfig:
  ignoreGhsas:
    - GHSA-gv7w-rqvm-qjhr
    # braces: advisory names >=3.0.4 as patched but no such release exists on
    # npm (latest 3.0.3). Build-time only, via Medusa CLI / mikro-orm globbing.
    # Remove once braces publishes a fix.
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  "@google/genai": true
  "@medusajs/telemetry": true
  "@sentry/cli": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@aws-sdk/checksums@3.1000.17"
  - "@aws-sdk/client-s3@3.1087.0"
  - "@aws-sdk/core@3.975.2"
  - "@aws-sdk/credential-provider-env@3.972.58"
  - "@aws-sdk/credential-provider-http@3.972.60"
  - "@aws-sdk/credential-provider-ini@3.973.2"
  - "@aws-sdk/credential-provider-login@3.972.64"
  - "@aws-sdk/credential-provider-node@3.972.68"
  - "@aws-sdk/credential-provider-process@3.972.58"
  - "@aws-sdk/credential-provider-sso@3.973.2"
  - "@aws-sdk/credential-provider-web-identity@3.972.64"
  - "@aws-sdk/middleware-sdk-s3@3.972.63"
  - "@aws-sdk/nested-clients@3.997.32"
  - "@aws-sdk/signature-v4-multi-region@3.996.40"
  - "@aws-sdk/token-providers@3.1087.0"
  - "@aws-sdk/types@3.974.1"
  - "@aws-sdk/xml-builder@3.972.35"
