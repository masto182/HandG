packages:
  - "apps/*"
  - "packages/*"

overrides:
  rollup: ">=4.22.4"
  lodash: ">=4.17.21"
  "@mikro-orm/core": ">=6.4.0"
  "@mikro-orm/knex": ">=6.6.14"
  "@opentelemetry/sdk-node": ">=0.217.0"
  "@opentelemetry/exporter-prometheus": ">=0.217.0"
  "fast-xml-builder": ">=1.1.7"
  axios: ">=1.16.0"
  "@grpc/grpc-js": ">=1.14.4"
  "form-data": ">=4.0.6"
  protobufjs: ">=7.6.1 <8"
  vite: ">=6.4.3 <7"
  multer: ">=2.2.0 <3"

auditConfig:
  ignoreGhsas:
    - GHSA-gv7w-rqvm-qjhr

allowBuilds:
  "@google/genai": true
  "@medusajs/telemetry": true
  "@sentry/cli": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
