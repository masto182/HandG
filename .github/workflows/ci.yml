name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20.20.2"
  PNPM_VERSION: "10.33.2"

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit-backend:
    name: Backend unit tests
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/backend test:unit:coverage

  component-storefront:
    name: Storefront component tests
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/storefront test:component:coverage

  build:
    name: Build (turbo)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  integration-backend:
    name: Backend integration tests (Node 20)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: medusa
          POSTGRES_PASSWORD: medusa
          POSTGRES_DB: medusa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medusa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://medusa:medusa@localhost:5432/medusa_test
      DB_USERNAME: medusa
      DB_PASSWORD: medusa
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret
      COOKIE_SECRET: ci-cookie-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Hard gate: the integration suite (per-file runner, ~18-20 min for 11
      # specs) MUST run and pass. No conditional skip. Meilisearch is not
      # provided here; the search-facet spec self-skips its Meili assertions
      # when unreachable (add a meilisearch service later to exercise them).
      - name: Backend integration tests
        run: pnpm --filter ./apps/backend test:integration

  e2e-smoke:
    name: E2E smoke (Playwright)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: medusa
          POSTGRES_PASSWORD: medusa
          POSTGRES_DB: medusa_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medusa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://medusa:medusa@localhost:5432/medusa_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret
      COOKIE_SECRET: ci-cookie-secret
      BRAND_NAME: "Hops & Glory"
      DEFAULT_CURRENCY: aud
      DEFAULT_COUNTRY: au
      MEDUSA_ADMIN_PATH: /app
      E2E_ADMIN_EMAIL: admin@example.test
      E2E_ADMIN_PASSWORD: ChangeMe123!
      PLAYWRIGHT_BACKEND_URL: http://localhost:9000
      PLAYWRIGHT_STOREFRONT_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build backend
        run: pnpm --filter ./apps/backend build
      - name: Migrate + seed
        env:
          SEED_TEST_ACCOUNTS: "true"
        run: |
          pnpm --filter ./apps/backend exec medusa db:migrate
          pnpm --filter ./apps/backend exec medusa exec ./src/scripts/seed.ts
          pnpm --filter ./apps/backend exec medusa user --email "${E2E_ADMIN_EMAIL}" --password "${E2E_ADMIN_PASSWORD}" || true
      - name: Start backend
        run: pnpm --filter ./apps/backend start &
      - name: Start storefront
        run: pnpm --filter ./apps/storefront dev &
      - name: Install Playwright browsers
        run: pnpm --filter ./apps/storefront exec playwright install --with-deps chromium
      - name: Wait for servers
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/health && curl -sf http://localhost:8000/ > /dev/null; then
              echo "ready"; break
            fi
            sleep 2
          done
      - name: Prepare smoke env (create test customers + resolve keys)
        run: bash scripts/smoke/ci-setup.sh
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          ADMIN_EMAIL: ${{ env.E2E_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
          BACKEND_DIR: apps/backend
      - name: Run smoke scripts
        run: |
          bash scripts/smoke/restock-alerts.sh
          bash scripts/smoke/early-access.sh
          bash scripts/smoke/product-alerts.sh
          bash scripts/smoke/api-emails.sh
          bash scripts/smoke/sprint-11b.sh
          bash scripts/smoke/security.sh
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          ADMIN_EMAIL: ${{ env.E2E_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
          BACKEND_DIR: apps/backend
      - name: Run smoke specs only
        run: pnpm --filter ./apps/storefront exec playwright test --grep @smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-smoke-report
          path: apps/storefront/playwright-report
