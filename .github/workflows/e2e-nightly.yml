name: E2E Nightly

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NODE_VERSION: "20.20.2"
  PNPM_VERSION: "10.33.2"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e-full:
    name: Full Playwright E2E suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: medusa
          POSTGRES_PASSWORD: medusa
          POSTGRES_DB: medusa_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medusa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://medusa:medusa@localhost:5432/medusa_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret
      COOKIE_SECRET: ci-cookie-secret
      BRAND_NAME: "Hops & Glory"
      DEFAULT_CURRENCY: aud
      DEFAULT_COUNTRY: au
      MEDUSA_ADMIN_PATH: /app
      E2E_ADMIN_EMAIL: admin@example.test
      E2E_ADMIN_PASSWORD: ChangeMe123!
      # CORS — must be set or Medusa serves no Access-Control-Allow-Origin headers
      # and all browser-side auth/store requests are blocked.
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:8000,http://localhost:9000
      PLAYWRIGHT_BACKEND_URL: http://localhost:9000
      PLAYWRIGHT_STOREFRONT_URL: http://localhost:8000
      # MinIO / S3
      S3_ENDPOINT: http://localhost:9100
      S3_FILE_URL: http://localhost:9100/medusa
      S3_ACCESS_KEY: medusa
      S3_SECRET_KEY: medusa_dev_password
      S3_BUCKET: medusa
      # MeiliSearch
      MEILI_HOST: http://localhost:7700
      MEILI_URL: http://localhost:7700
      MEILI_MASTER_KEY: dev-meili-master-key
      MEDUSA_FF_INDEX_ENGINE: "true"
      # Storefront public vars
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_STORE_URL: http://localhost:8000
      NEXT_PUBLIC_PAYID_ALIAS: payments@example.test
      STOREFRONT_IMAGE_HOSTS: localhost
      PLAYWRIGHT_PROD_URL: http://localhost:8000
      # Proxy auth/store/admin through Next.js so session cookies are same-origin.
      # In production Caddy handles this; in CI we need Next.js rewrites instead.
      NEXT_REWRITES_BACKEND: http://localhost:9000
    steps:
      - uses: actions/checkout@v4

      - name: Start MeiliSearch
        # MeiliSearch's debian:12-slim image has no wget/curl, so we can't use a
        # services: health check. Run it as a docker step and poll from the host.
        run: |
          docker run -d --name meilisearch \
            -p 7700:7700 \
            -e MEILI_MASTER_KEY=dev-meili-master-key \
            -e MEILI_ENV=development \
            getmeili/meilisearch:v1.12
          for i in $(seq 1 30); do
            curl -sf http://localhost:7700/health && break || sleep 1
          done

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9100:9000 \
            -e MINIO_ROOT_USER=medusa \
            -e MINIO_ROOT_PASSWORD=medusa_dev_password \
            minio/minio:RELEASE.2024-10-13T13-34-11Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9100/minio/health/live && break || sleep 1
          done

      - name: Init MinIO bucket
        run: |
          docker run --rm --network=host \
            -e MC_HOST_minio=http://medusa:medusa_dev_password@localhost:9100 \
            minio/mc:RELEASE.2024-10-08T09-37-26Z \
            mb minio/medusa --ignore-existing
          docker run --rm --network=host \
            -e MC_HOST_minio=http://medusa:medusa_dev_password@localhost:9100 \
            minio/mc:RELEASE.2024-10-08T09-37-26Z \
            anonymous set none minio/medusa

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter @retail-example/shared-types build
      - name: Build backend
        run: pnpm --filter ./apps/backend build
      - name: Migrate + seed
        env:
          SEED_TEST_ACCOUNTS: "true"
        run: |
          pnpm --filter ./apps/backend exec medusa db:migrate
          pnpm --filter ./apps/backend exec medusa exec ./src/scripts/seed.ts
          pnpm --filter ./apps/backend exec medusa user --email "${E2E_ADMIN_EMAIL}" --password "${E2E_ADMIN_PASSWORD}" || true
      - name: Create CI publishable key
        run: |
          pnpm --filter ./apps/backend exec medusa exec ./src/scripts/create-ci-publishable-key.ts \
            > /tmp/pubkey-stdout.txt 2>/tmp/pubkey-stderr.txt \
            || { echo "--- medusa exec stderr ---"; cat /tmp/pubkey-stderr.txt; exit 1; }
          grep '^NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=' /tmp/pubkey-stdout.txt >> "$GITHUB_ENV" \
            || { echo "--- stdout ---"; cat /tmp/pubkey-stdout.txt; echo "--- stderr ---"; cat /tmp/pubkey-stderr.txt; exit 1; }
      - name: Start backend
        # Must run from .medusa/server/ so the admin loader resolves
        # public/admin/index.html correctly — mirrors the Dockerfile CMD.
        working-directory: apps/backend/.medusa/server
        run: ../../node_modules/.bin/medusa start > /tmp/backend.log 2>&1 &
      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/health && break || sleep 2
          done
      - name: Build storefront (production)
        run: pnpm --filter ./apps/storefront build
      - name: Start storefront (port 8000)
        # Use next start (production server) in CI — more reliable than next dev
        # in a runner with no display. Both prod-smoke and regular tests run
        # against the same production build on :8000.
        working-directory: apps/storefront
        run: pnpm exec next start -p 8000 > /tmp/storefront.log 2>&1 &
      - name: Install Playwright browsers
        run: pnpm --filter ./apps/storefront exec playwright install --with-deps chromium
      - name: Wait for servers
        run: |
          ok=0
          for i in $(seq 1 90); do
            if curl -sf http://localhost:9000/health \
                && curl -s -o /dev/null http://localhost:8000/; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || {
            echo "--- backend log ---"; cat /tmp/backend.log
            echo "--- storefront log ---"; cat /tmp/storefront.log
            echo "servers never became ready"; exit 1
          }
      - name: Configure MeiliSearch index
        run: pnpm --filter ./apps/backend exec medusa exec ./src/scripts/reindex-search.ts
      - name: Seed E2E products and verify store count
        # Run the product seed explicitly here (in addition to globalSetup) so we
        # can verify the channel link before any test runs.  globalSetup also runs
        # the seed, but any issues with medusa exec DB commits would be caught here.
        run: |
          pnpm --filter ./apps/backend exec medusa exec ./src/scripts/seed-e2e-products.ts

          # Get admin bearer token
          ADMIN_TOKEN=$(curl -sf -X POST http://localhost:9000/auth/user/emailpass \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${E2E_ADMIN_EMAIL}\",\"password\":\"${E2E_ADMIN_PASSWORD}\"}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('token',''))")

          # Get channel ID by name
          CHANNEL_ID=$(curl -sf "http://localhost:9000/admin/sales-channels?q=Store" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); chs=d.get('sales_channels',[]); print(next((c['id'] for c in chs if c['name'].endswith(' Store')),None))")
          echo "Channel ID: $CHANNEL_ID"

          # Get all published product IDs (limit 100)
          PRODUCT_IDS=$(curl -sf "http://localhost:9000/admin/products?limit=100&status[]=published" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(','.join(p['id'] for p in d.get('products',[])))")
          echo "Product IDs: $PRODUCT_IDS"

          # Add all products to channel via admin API
          if [ -n "$CHANNEL_ID" ] && [ -n "$PRODUCT_IDS" ]; then
            PRODUCT_IDS_JSON=$(echo "$PRODUCT_IDS" | python3 -c "import sys,json; ids=sys.stdin.read().strip().split(','); print(json.dumps({'product_ids': ids}))")
            curl -sf -X POST "http://localhost:9000/admin/sales-channels/$CHANNEL_ID/products" \
              -H "Authorization: Bearer $ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PRODUCT_IDS_JSON" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print('Added products:', len(d.get('sales_channel',{}).get('products',[])))" \
              || echo "Note: products may already be linked"
          fi

          # Verify store count with the publishable key
          STORE_COUNT=$(curl -sf "http://localhost:9000/store/products?limit=1" \
            -H "x-publishable-api-key: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('count','?'))")
          echo "Store product count: $STORE_COUNT"

          # Direct DB diagnostic — show sales channel rows
          echo "--- ACTIVE (non-deleted) product_sales_channel rows ---"
          PGPASSWORD=medusa psql -h localhost -U medusa -d medusa_db \
            -c "SELECT COUNT(*) AS active_links FROM product_sales_channel WHERE deleted_at IS NULL;" || true
          echo "--- SOFT-DELETED product_sales_channel rows ---"
          PGPASSWORD=medusa psql -h localhost -U medusa -d medusa_db \
            -c "SELECT COUNT(*) AS deleted_links FROM product_sales_channel WHERE deleted_at IS NOT NULL;" || true
          echo "--- published products count ---"
          PGPASSWORD=medusa psql -h localhost -U medusa -d medusa_db \
            -c "SELECT COUNT(*) AS published FROM product WHERE status='published';" || true
          echo "--- variant price set links ---"
          PGPASSWORD=medusa psql -h localhost -U medusa -d medusa_db \
            -c "SELECT COUNT(*) AS price_links FROM product_variant_price_set;" || true
          echo "--- products with price links ---"
          PGPASSWORD=medusa psql -h localhost -U medusa -d medusa_db \
            -c "SELECT COUNT(DISTINCT v.product_id) AS products_with_prices FROM product_variant v JOIN product_variant_price_set pvps ON pvps.variant_id = v.id;" || true
          echo "--- products per sales channel ---"
          PGPASSWORD=medusa psql -h localhost -U medusa -d medusa_db \
            -c "SELECT psc.sales_channel_id, COUNT(*) AS cnt FROM product_sales_channel psc GROUP BY psc.sales_channel_id;" || true
          echo "--- ALL sales channels ---"
          PGPASSWORD=medusa psql -h localhost -U medusa -d medusa_db \
            -c "SELECT id, name, created_at FROM sales_channel ORDER BY created_at;" || true
          echo "--- publishable key → channel ---"
          PGPASSWORD=medusa psql -h localhost -U medusa -d medusa_db \
            -c "SELECT ak.token, paksc.sales_channel_id FROM api_key ak JOIN publishable_api_key_sales_channel paksc ON paksc.publishable_key_id = ak.id WHERE ak.deleted_at IS NULL;" || true
          echo "--- store products handles ---"
          curl -sf "http://localhost:9000/store/products?limit=20" \
            -H "x-publishable-api-key: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('count:', d.get('count',0)); [print(' -', p['handle']) for p in d.get('products',[])]" || echo "store query failed"
      - name: Run full Playwright suite
        run: pnpm --filter ./apps/storefront exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-nightly-report
          path: apps/storefront/playwright-report
