name: Promote to production

# Manual-only. Promotes a previously-built (and ideally staging-tested) image
# tag to :prod and deploys to the Oracle production host. Tags the previous
# :prod image as :previous so rollback-prod.yml can revert in seconds.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Source tag to promote (e.g. staging, sha-abc1234). Defaults to staging."
        required: true
        default: "staging"
      skip_migrations:
        description: "Skip db:migrate after deploy (set true for hotfix that touches no schema)"
        required: false
        default: "false"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: masto182

jobs:
  retag:
    name: Retag images :prod (and stash old :prod -> :previous)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Refuse non-main promotion
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Refusing to promote: workflow must run from main (got ${{ github.ref }})."
          exit 1

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify source tag exists
        run: |
          for app in backend storefront; do
            REPO="${REGISTRY}/${OWNER}/${app}"
            SRC="${REPO}:${{ github.event.inputs.image_tag }}"
            if ! docker buildx imagetools inspect "$SRC" >/dev/null 2>&1; then
              echo "Source tag $SRC does not exist in registry. Aborting promotion."
              exit 1
            fi
            echo "Verified $SRC exists."
          done

      - name: Promote backend + storefront
        run: |
          for app in backend storefront; do
            REPO="${REGISTRY}/${OWNER}/${app}"
            SRC="${REPO}:${{ github.event.inputs.image_tag }}"
            echo "::group::Promote $app from $SRC"
            # Stash current :prod as :previous (ignore if no current :prod yet).
            if docker buildx imagetools inspect "${REPO}:prod" >/dev/null 2>&1; then
              docker buildx imagetools create -t "${REPO}:previous" "${REPO}:prod"
            else
              echo "No existing :prod for $app, skipping :previous tag."
            fi
            # Promote source tag to :prod.
            docker buildx imagetools create -t "${REPO}:prod" "$SRC"
            echo "::endgroup::"
          done

  deploy:
    name: Deploy :prod to Oracle
    needs: retag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/retail-example
            git fetch origin main
            git reset --hard origin/main
            export BACKEND_IMAGE="ghcr.io/masto182/backend:prod"
            export STOREFRONT_IMAGE="ghcr.io/masto182/storefront:prod"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.production"
            echo "Docker disk usage before cleanup:"
            docker system df
            # Only prune stopped containers and build cache BEFORE pull. Do NOT
            # prune images here: that would delete the current running image and
            # weaken rollback if the pull below fails. Images are pruned after a
            # successful pull + up.
            docker container prune -f
            docker builder prune -af || true
            echo "Docker disk usage after cleanup:"
            docker system df
            $COMPOSE pull
            # Bring up datastores first so migrations have something to connect to.
            $COMPOSE up -d --remove-orphans postgres redis meilisearch
            # Migrate via a one-off container BEFORE starting the backend, unless
            # skipped. Verified on staging (diagnose-staging-migrate run
            # 27245055317) that the standard migrator completes on this OCI host
            # with exit 0 and no external calls when invoked via the binary (not
            # npx) with --skip-scripts --skip-links. Links synced by the next step.
            MEDUSA="./node_modules/.bin/medusa exec"
            if [ "${{ github.event.inputs.skip_migrations }}" != "true" ]; then
              $COMPOSE run --rm --no-deps backend ./node_modules/.bin/medusa db:migrate --skip-scripts --skip-links
              # Sync cross-module link tables (pivot tables between modules).
              $COMPOSE run --rm --no-deps backend ./node_modules/.bin/medusa db:sync-links
              # Idempotent seed chain (mirrors deploy-staging.yml). Bootstraps a fresh
              # DB; no-ops on an already-seeded prod DB via find-or-create / store-exists
              # guards. Test fixtures are intentionally excluded (seed-e2e-products,
              # seed-test-accounts, create-approved-member); seed.ts's demo accounts stay
              # off because SEED_TEST_ACCOUNTS is unset in .env.production.
              $COMPOSE run --rm --no-deps backend $MEDUSA ./src/migration-scripts/initial-data-seed.ts
              $COMPOSE run --rm --no-deps backend $MEDUSA ./src/scripts/seed.ts
              $COMPOSE run --rm --no-deps backend $MEDUSA ./src/scripts/seed-beer-styles.ts
              $COMPOSE run --rm --no-deps backend $MEDUSA ./src/scripts/seed-hops.ts
              $COMPOSE run --rm --no-deps backend $MEDUSA ./src/scripts/seed-vip-config.ts
              $COMPOSE run --rm --no-deps backend $MEDUSA ./src/scripts/link-locations-to-sales-channel.ts
              $COMPOSE run --rm --no-deps backend $MEDUSA ./src/scripts/link-products-to-channel.ts
            fi
            $COMPOSE run --rm --no-deps backend $MEDUSA ./src/scripts/reindex-search.ts
            $COMPOSE up -d --remove-orphans
            docker image prune -af
            docker builder prune -af || true
            echo "Docker disk usage after deploy cleanup:"
            docker system df
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Production health probe
        timeout-minutes: 5
        run: |
          for i in {1..30}; do
            if curl -fsS https://${{ vars.PRODUCTION_DOMAIN }}/health/ready >/dev/null && \
               curl -fsS https://${{ vars.PRODUCTION_DOMAIN }}/api/health/ready >/dev/null; then
              echo "Production healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Production health probe failed - consider running rollback-prod.yml"
          exit 1
