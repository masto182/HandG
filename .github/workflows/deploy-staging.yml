name: Deploy staging

on:
  workflow_run:
    workflows: ["Build images (arm64 -> ghcr.io)"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Deploy :staging tag to Oracle host
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Refuse non-main builds
        if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch != 'main'
        run: |
          echo "Refusing to deploy: head_branch was ${{ github.event.workflow_run.head_branch }}, expected main."
          exit 1

      - uses: actions/checkout@v4

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 15m
          envs: "GITHUB_SHA,GHCR_USER,GHCR_TOKEN"
          script: |
            set -euo pipefail
            cd /opt/hopsandglory-staging
            git fetch origin main
            git reset --hard origin/main
            export BACKEND_IMAGE="ghcr.io/masto182/backend:staging"
            export STOREFRONT_IMAGE="ghcr.io/masto182/storefront:staging"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.staging.yml --env-file .env.staging"
            echo "Docker disk usage before cleanup:"
            docker system df
            # Only prune stopped containers and build cache BEFORE pull. Do NOT
            # prune images here: that would delete the current running image and
            # weaken rollback if the pull below fails. Images are pruned after a
            # successful pull + up.
            docker container prune -f
            docker builder prune -af || true
            echo "Docker disk usage after cleanup:"
            docker system df
            $COMPOSE pull
            # Bring up datastores first so migrations have something to connect to.
            $COMPOSE up -d --remove-orphans postgres redis meilisearch
            # Run DB migrations in a one-off container BEFORE starting the backend.
            # We use scripts/run-migrations.cjs instead of `medusa db:migrate`:
            # on this OCI host the official migrator hangs in MedusaApp_ module
            # bootstrap and never applies migrations. The direct-SQL runner applies
            # each module's migration SQL straight to postgres and is idempotent.
            $COMPOSE run --rm --no-deps backend node scripts/run-migrations.cjs
            # Sync cross-module link tables (pivot tables between modules). Must
            # run after module migrations. Uses the binary directly (not npx) to
            # avoid the registry.npmjs.org lookup that hangs on restricted-egress hosts.
            $COMPOSE run --rm --no-deps backend ./node_modules/.bin/medusa db:sync-links
            $COMPOSE up -d --remove-orphans
            docker image prune -af
            docker builder prune -af || true
            echo "Docker disk usage after deploy cleanup:"
            docker system df
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Health probe
        timeout-minutes: 5
        run: |
          for i in {1..30}; do
            if curl -fsS https://${{ vars.STAGING_DOMAIN }}/health/ready >/dev/null && \
               curl -fsS https://${{ vars.STAGING_DOMAIN }}/api/health/ready >/dev/null; then
              echo "Staging healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Staging health probe failed"
          exit 1
